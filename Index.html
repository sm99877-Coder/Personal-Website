<html> 
<head>
  <link rel="stylesheet" href="style.css" />
  <link rel="script" href="DataAnalyzer.js">
</head>
  
<body> 
  <h1> Data Analyzer:</h1>
  <section style="background-color: darkslategrey; color: white;">
    <h3> Basic Statistics Calculator </h3>
    <input type="text" id="BSC_Input"> <button onclick='FormatData(document.getElementById("BSC_Input").value)'> </button>
    <span id="BSC_Output"> Calculate Avg. </span>
  </section> 

<script> 
function FormatData(a) {
  mySpan = document.getElementById("BSC_Output");
  mySpan.innerHTML = a;
}
</script>
</body>
</html>
